<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Love Heart</title>
<meta name="theme-color" content="#060208" />
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #060208;
    overflow: hidden;
  }
  #cv {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="cv" aria-label="A heart drawn with I love you in many languages"></canvas>
<script>
(() => {
  "use strict";

  const SC = 21;
  const OY = 20;
  const DURATION = 10;
  const TICK = 16;
  const ANIM = 42;
  const LIFT = 34;
  const GAP = 7;
  const SIZES = [9, 10, 11, 12];
  const FONT_FAMILY = '"Arial", "Helvetica Neue", Helvetica, "Noto Sans", sans-serif';
  const BG = "#060208";
  const FLASH = [1.0, 0.78, 0.78];
  const WINE = [0.58, 0.0, 0.09];
  const CRIMSON = [0.90, 0.05, 0.14];
  const BLOOD = [0.98, 0.10, 0.16];
  const BGC = [6 / 255, 2 / 255, 8 / 255];
  const TAU = Math.PI * 2;
  const ART = 800;
  const PT_TO_PX = 1.334646962233169;
  const LINES = { 9: 15, 10: 16, 11: 18, 12: 19 };

  const PHRASES = [
    "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
    "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
    "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
    "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
    "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю",
  ];
  PHRASES.push("Te amo Shaira", "Te amo Shaira", "Te amo Shaira");
  PHRASES.push("Eres mi vida entera", "Eres mi vida entera", "Eres mi vida entera");

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const rng = mulberry32(11);
  const uniform = (a, b) => a + (b - a) * rng();
  const choice = (arr) => arr[Math.floor(rng() * arr.length)];
  const shuffle = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
  };

  const clamp = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
  const mix = (a, b, k) => [
    a[0] + (b[0] - a[0]) * k,
    a[1] + (b[1] - a[1]) * k,
    a[2] + (b[2] - a[2]) * k,
  ];
  const dim = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
  const hx = (c) =>
    "rgb(" +
    Math.floor(clamp(c[0]) * 255) +
    "," +
    Math.floor(clamp(c[1]) * 255) +
    "," +
    Math.floor(clamp(c[2]) * 255) +
    ")";

  const measureCtx = document.createElement("canvas").getContext("2d");
  measureCtx.textAlign = "center";
  measureCtx.textBaseline = "middle";
  const fontFor = (size) => `bold ${Math.round(size * PT_TO_PX)}px ${FONT_FAMILY}`;
  const measure = (text, size) => {
    measureCtx.font = fontFor(size);
    return measureCtx.measureText(text).width;
  };

  function heart(a) {
    const x = 16 * Math.pow(Math.sin(a), 3);
    const y =
      13 * Math.cos(a) -
      5 * Math.cos(2 * a) -
      2 * Math.cos(3 * a) -
      Math.cos(4 * a);
    return [x * SC, y * SC + OY];
  }

  const POLY = [];
  for (let i = 0; i < 720; i++) POLY.push(heart((TAU * i) / 720));
  const EDGES = POLY.map((p, i) => [p, POLY[(i + 1) % POLY.length]]);
  const YMAX = Math.max(...POLY.map((p) => p[1]));
  const YMIN = Math.min(...POLY.map((p) => p[1]));
  const CY = (YMAX + YMIN) / 2;

  function spans(y) {
    const xs = [];
    for (const [a, b] of EDGES) {
      const x1 = a[0], y1 = a[1], x2 = b[0], y2 = b[1];
      if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
        xs.push(x1 + ((y - y1) * (x2 - x1)) / (y2 - y1));
      }
    }
    xs.sort((a, b) => a - b);
    const out = [];
    for (let i = 0; i + 1 < xs.length; i += 2) out.push([xs[i], xs[i + 1]]);
    return out;
  }

  function intersect(A, B) {
    const out = [];
    for (const a of A) {
      for (const b of B) {
        const lo = Math.max(a[0], b[0]);
        const hi = Math.min(a[1], b[1]);
        if (hi - lo > 14) out.push([lo, hi]);
      }
    }
    return out;
  }

  function mathDist(x, y) {
    return Math.hypot(x / (16 * SC), (y - CY) / (14.5 * SC));
  }

  let phraseBag = [];
  let phraseIdx = 0;
  function nextPhrase() {
    if (phraseIdx >= phraseBag.length) {
      phraseBag = PHRASES.slice();
      shuffle(phraseBag);
      phraseIdx = 0;
    }
    return phraseBag[phraseIdx++];
  }

  function build() {
    const rowH = Math.max(...SIZES.map((s) => LINES[s])) + 4;
    const half = rowH / 2;
    const placed = [];

    let y = YMAX - half;
    while (y > YMIN + half) {
      const row = intersect(spans(y + half), spans(y - half));

      for (const seg of row) {
        const lo = seg[0] + 4;
        const hi = seg[1] - 4;
        let cur = lo + uniform(0, 8);
        const line = [];

        for (;;) {
          let fit = null;
          for (let attempt = 0; attempt < 10; attempt++) {
            const text = nextPhrase();
            const size = choice(SIZES);
            const w = measure(text, size);
            if (cur + w <= hi) {
              fit = { text, size, w };
              break;
            }
          }
          if (!fit) break;
          line.push({ x: cur + fit.w / 2, text: fit.text, size: fit.size, w: fit.w });
          cur += fit.w + GAP;
        }

        if (!line.length) continue;

        if (line.length > 1) {
          const last = line[line.length - 1];
          const left = hi - (last.x + last.w / 2);
          for (let i = 0; i < line.length; i++) {
            line[i].x += (left * i) / (line.length - 1);
          }
        } else {
          line[0].x = (lo + hi) / 2;
        }

        for (let i = 0; i < line.length; i++) {
          const it = line[i];
          placed.push({
            x: it.x,
            y: y,
            text: it.text,
            size: it.size,
            edge: i === 0 || i === line.length - 1,
          });
        }
      }

      y -= rowH;
    }

    for (const p of placed) {
      const rad = Math.min(1, mathDist(p.x, p.y));
      let base = mix(WINE, CRIMSON, 0.25 + 0.75 * rad);
      base = mix(base, BLOOD, uniform(0, 0.35) + (p.edge ? 0.3 : 0));
      p.color = base.map((v) => Math.min(1, v));
      p.rad = rad;
    }

    const edgeItems = placed.filter((p) => p.edge);
    const innerItems = placed.filter((p) => !p.edge);

    for (const p of edgeItems) {
      p.key = ((Math.atan2(p.x, p.y - CY) % TAU) + TAU) % TAU;
    }
    edgeItems.sort((a, b) => a.key - b.key);

    for (const p of innerItems) {
      p.key = -p.rad + uniform(0, 0.08);
    }
    innerItems.sort((a, b) => a.key - b.key);

    return edgeItems.concat(innerItems);
  }

  const ORDER = build();
  const RATE = ORDER.length / ((DURATION * 1000) / TICK);

  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const baseCanvas = document.createElement("canvas");
  const baseCtx = baseCanvas.getContext("2d");

  const spawned = [];
  let active = [];
  const flashes = new Map();
  let cursor = 0;
  let spawnAcc = 0;
  let spawning = true;
  let animating = true;

  let dpr = 1;
  let scale = 1;
  let viewW = 0;
  let viewH = 0;

  function applyArtTransform(c) {
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.translate(viewW / 2, viewH / 2);
    c.scale(scale, scale);
    c.textAlign = "center";
    c.textBaseline = "middle";
  }

  function drawFinal(c, item) {
    const x = item.x;
    const y = -item.y;

    c.font = fontFor(item.size);
    c.fillStyle = hx(dim(item.color, 0.30));
    c.fillText(item.text, x + 2, y + 3);

    c.font = fontFor(item.size + 1);
    c.fillStyle = hx(dim(item.color, 0.20));
    c.fillText(item.text, x, y);

    c.font = fontFor(item.size);
    c.fillStyle = hx(item.color);
    c.fillText(item.text, x, y);
  }

  function drawActive(c, item) {
    const u = clamp(item.f / ANIM);
    const e = 1 - Math.pow(1 - u, 3);
    const x = item.x + item.dx * (1 - e);
    const y = -item.y - (1 - e) * LIFT;

    const shadow = mix(BGC, dim(item.color, 0.30), e);
    const halo = mix(BGC, dim(item.color, 0.20), e * e);
    const flash = 0.75 * Math.sin(Math.PI * clamp((u - 0.55) / 0.45));
    const main = mix(mix(BGC, item.color, Math.pow(e, 1.5)), FLASH, flash);

    c.font = fontFor(item.size);
    c.fillStyle = hx(shadow);
    c.fillText(item.text, item.x + 2, -item.y + 3);

    c.font = fontFor(item.size + 1);
    c.fillStyle = hx(halo);
    c.fillText(item.text, x, y);

    c.font = fontFor(item.size);
    c.fillStyle = hx(main);
    c.fillText(item.text, x, y);
  }

  function redrawBase() {
    baseCtx.setTransform(1, 0, 0, 1, 0, 0);
    baseCtx.fillStyle = BG;
    baseCtx.fillRect(0, 0, baseCanvas.width, baseCanvas.height);
    applyArtTransform(baseCtx);
    for (const item of spawned) {
      if (item.done) drawFinal(baseCtx, item);
    }
  }

  function resize() {
    viewW = Math.max(1, window.innerWidth || document.documentElement.clientWidth);
    viewH = Math.max(1, window.innerHeight || document.documentElement.clientHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);

    const pw = Math.round(viewW * dpr);
    const ph = Math.round(viewH * dpr);
    if (cv.width !== pw || cv.height !== ph) {
      cv.width = baseCanvas.width = pw;
      cv.height = baseCanvas.height = ph;
    }

    scale = Math.min(viewW, viewH) / ART;
    redrawBase();
    render();
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(baseCanvas, 0, 0);

    if (!active.length && flashes.size === 0) return;

    applyArtTransform(ctx);
    for (const item of active) drawActive(ctx, item);
    for (const entry of flashes) {
      const item = entry[0];
      const color = entry[1];
      ctx.font = fontFor(item.size);
      ctx.fillStyle = hx(color);
      ctx.fillText(item.text, item.x, -item.y);
    }
  }

  function spawn(p) {
    p.f = 0;
    p.done = false;
    p.dx = uniform(-10, 10);
    spawned.push(p);
    active.push(p);
  }

  function tick() {
    if (spawning) {
      spawnAcc += RATE;
      while (spawnAcc >= 1) {
        spawnAcc -= 1;
        if (cursor < ORDER.length) {
          spawn(ORDER[cursor++]);
        } else {
          spawning = false;
          break;
        }
      }
      if (cursor >= ORDER.length) spawning = false;
    }

    if (active.length) {
      const still = [];
      for (const item of active) {
        item.f += 1;
        if (item.f >= ANIM) {
          item.done = true;
          drawFinal(baseCtx, item);
        } else {
          still.push(item);
        }
      }
      active = still;
    }
  }

  function startShimmer() {
    setInterval(() => {
      const item = spawned[Math.floor(rng() * spawned.length)];
      flashes.set(item, mix(item.color, FLASH, 0.6));
      render();
      setTimeout(() => {
        flashes.delete(item);
        render();
      }, 260);
    }, 140);
  }

  let lastTime = 0;
  let timeAcc = 0;

  function frame(now) {
    if (!animating) return;
    if (!lastTime) lastTime = now;
    let dt = now - lastTime;
    lastTime = now;
    if (dt > 100) dt = 100;
    timeAcc += dt;

    let guard = 0;
    while (timeAcc >= TICK && guard < 12) {
      timeAcc -= TICK;
      tick();
      guard += 1;
    }

    if (!spawning && active.length === 0) {
      animating = false;
      startShimmer();
    }

    render();

    if (animating) {
      requestAnimationFrame(frame);
    } else {
      lastTime = 0;
    }
  }

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
